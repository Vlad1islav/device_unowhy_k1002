name: Build OrangeFox

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Recovery
    # Используем Ubuntu 20.04 — только в ней есть нужные старые пакеты для Android 9
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        # Скачиваем твои файлы в временную папку
        path: device_tree

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        # Ставим всё, включая Python 2 и старые библиотеки ncurses
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python2 python-is-python2
        
    - name: Download OrangeFox Source (Android 9.0)
      run: |
        rm -rf ~/fox_sync
        mkdir -p ~/fox_sync
        cd ~/fox_sync
        
        git config --global user.name "Builder"
        git config --global user.email "builder@example.com"
        
        # Качаем инструмент repo
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
        chmod a+x ~/repo
        sudo mv ~/repo /usr/local/bin/repo
        
        # Инициализация через GitHub зеркало (исправлено -u и добавлен фикс для ошибки 500)
        repo init -u https://github.com/OrangeFoxRecovery/Manifest.git -b fox_9.0 --depth=1 --no-clone-bundle
        
        # Качаем исходники (может занять 15-20 минут)
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Move Device Tree to Source
      run: |
        # Твои пути: создаем папку производителя unowhy и кидаем туда проект k1002
        mkdir -p ~/fox_sync/device/unowhy/
        mv $GITHUB_WORKSPACE/device_tree ~/fox_sync/device/unowhy/k1002
        # Проверка для спокойствия: если папка на месте, выведет список файлов
        ls -l ~/fox_sync/device/unowhy/k1002/

    - name: Build OrangeFox
      run: |
        cd ~/fox_sync
        source build/envsetup.sh
        # Разрешаем сборку без некоторых зависимостей
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        
        # Запуск сборки на основе твоего файла omni_k1002.mk
        lunch omni_k1002-eng
        mka recoveryimage

    - name: Upload Recovery
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-k1002-Recovery
        # Путь к готовому файлу после сборки
        path: ~/fox_sync/out/target/product/k1002/recovery.img
