name: Build OrangeFox

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Recovery
    # Ставим ту версию, которую ты выбрал на скрине
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device_tree

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        # Установка базовых пакетов
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python2 python-is-python2
        
        # ФИКС ДЛЯ UBUNTU 22.04: качаем старый ncurses вручную, раз его нет в репозитории
        wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb
        wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
        sudo dpkg -i libncurses5_6.3-2_amd64.deb

    - name: Download OrangeFox Source (Android 9.0)
      run: |
        rm -rf ~/fox_sync
        mkdir -p ~/fox_sync
        cd ~/fox_sync
        
        git config --global user.name "Builder"
        git config --global user.email "builder@example.com"
        
        # Установка repo
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
        chmod a+x ~/repo
        sudo mv ~/repo /usr/local/bin/repo
        
        # Исправленный repo init (без --u и с защитой от ошибки 500)
        repo init -u https://github.com/OrangeFoxRecovery/Manifest.git -b fox_9.0 --depth=1 --no-clone-bundle
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Move Device Tree to Source
      run: |
        # Твой путь к дереву из скрина
        mkdir -p ~/fox_sync/device/unowhy
        mv $GITHUB_WORKSPACE/device_tree ~/fox_sync/device/unowhy/k1002

    - name: Build OrangeFox
      run: |
        cd ~/fox_sync
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        
        # Используем твой конфиг omni_k1002.mk
        lunch omni_k1002-eng
        mka recoveryimage

    - name: Upload Recovery
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-k1002-Recovery
        path: ~/fox_sync/out/target/product/k1002/recovery.img
